# espanso match file

# For a complete introduction, visit the official docs at: https://espanso.org/docs/

# You can use this file to define the base matches (aka snippets)
# that will be available in every application when using espanso.

# Matches are substitution rules: when you type the "trigger" string
# it gets replaced by the "replace" string.

# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json

matches:

  # --------- PROMPTS ---------------

  # GENERIC TASK
  - trigger: ":pr_basic"
    replace: |
      <TASK>
      Describe exactly what you want the model to do.
      [IF ASKING FOR RECOMMENDATION: ASK FOR DIFFERENT OPTIONS, NOT FOR THE BEST ONE]
      </TASK>

      <CONTEXT>
      Provide relevant background information.
      Only include information necessary to complete the task.
      </CONTEXT>

      <CONSTRAINTS>
      - Tone / style requirements
      - Length limits
      - Things to avoid
      - Formatting rules
      </CONSTRAINTS>

      <OUTPUT_FORMAT>
      - Specify exactly how the output should be structured.
      - Specify if a mrkd file should be generated as a result of the conversation
      Examples:
      - Bullet points
      - JSON
      - Markdown
      - Table
      - Step-by-step reasoning
      </OUTPUT_FORMAT>

  # EXPLANATION
  - trigger: ":pr_explain"
    replace: |
      <TASK>
      Explain how [JWT (JSON Web Tokens)] work for authentication.
      Structure your explanation as:
      1. What problem JWTs solve
      2. How they're structured
      3. The authentication flow
      4. Common security considerations
      Target audience: Backend developers new to authentication.
      </TASK>

  # LEARN A NEW TOPIC
  - trigger: ":pr_learn"
    replace: |
      ### ROLE
      You are an experienced [DevOps Engineer] - with your help I would like to understand a new topic.

      ### CURRENT KNOWLEDGE
      My knowledge level: [advanced] in [JavaScript] technology.
      I have [6 years] of experience with [React, Redux, and Jenkins].

      ### LEARNING GOAL
      // I want to understand [GitHub Actions] to [build the first CI/CD scenario in a GitHub repository].
      // I need to understand the basics of indexes in SQL.

      ### BLOCKERS
      I'm encountering the following blocker: [I don't understand the difference between job and workflow and on what system tasks should be run - Ubuntu or Windows?].

      ### PROCESS
      Please explain this topic step by step, starting from [basics] and moving to [advanced aspects/practical application].

      ### PREFERRED FORMAT
      // I learn best through [problem visualizations and practical diagrams].
      // I prefer an answer in the form of [brief guide with examples/detailed explanation with comments/demo project/series of exercises with increasing difficulty].
      // Please explain the concept by using references to basic concepts in the domain I'm already familiar with.
      // Please use simple mermaid diagrams to visualize the process.
      // Please explain the process in detail, going through it step by step.

  # IMPROVE / REFINE A PROMPT
  - trigger: ":pr_improve"
    replace: |
      You are a senior Prompt Engineer and AI Systems Architect.
      Your task is to refine the prompt provided below to maximize:
      - Accuracy
      - Clarity
      - Precision
      - Determinism (reduce hallucinations)
      - Structural quality
      - Alignment with original intent and audience
      - Robustness against ambiguity

      You are improving the prompt — not changing its purpose.

      ------------------------------------------------------------
      PROCESS
      ------------------------------------------------------------
      1. Analyze the original prompt and identify weaknesses, including:
         - Ambiguity or vague instructions
         - Missing constraints or guardrails
         - Overly broad scope
         - Missing output structure
         - Hallucination risks
         - Logical inconsistencies
         - Redundancies or contradictions

      2. Apply meaningful improvements:
         - Increase clarity and specificity
         - Add output formatting rules where useful
         - Add guardrails (e.g., instruct the model to say "Insufficient information" instead of guessing when appropriate)
         - Improve logical sequencing and instruction flow
         - Preserve the original tone, persona, and purpose

      3. If you make major structural changes, briefly explain the reasoning (1-2 sentences) before presenting the revised prompt.

      4. Include a short before-and-after micro example (1-2 lines) that illustrates one concrete refinement improvement.

      ------------------------------------------------------------
      CONSTRAINTS
      ------------------------------------------------------------
      - Do NOT change the original intent or target audience.
      - Do NOT introduce unnecessary complexity.
      - Do NOT add stylistic changes unless they improve clarity or alignment.
      - Prefer structured outputs when helpful (bullet points, numbered steps, JSON schema, etc.).
      - If factual correctness is critical, explicitly instruct the future model to avoid guessing.

      ------------------------------------------------------------
      MANDATORY FINAL VALIDATION CHECKLIST
      ------------------------------------------------------------
      Before finalizing, verify:
      - No drift from original purpose or audience
      - All identified weaknesses were meaningfully addressed
      - Clarity and instruction flow are improved
      - Logical structure is stronger than the original
      - Constraints and guardrails are explicit where needed
      - The revised prompt is self-contained and production-ready

      ------------------------------------------------------------
      OPTIONAL CONTRARIAN CHECK
      ------------------------------------------------------------
      Briefly ask:
      "Is there a substantially stronger framing of this prompt?"
      If yes, note it in one sentence before finalizing.
      If not, proceed.

      ------------------------------------------------------------
      OUTPUT FORMAT
      ------------------------------------------------------------
      ## 1. Weakness Analysis
      (Concise bullet list)

      ## 2. Structural Change Rationale (if applicable)
      (1-2 sentences, only if major changes were made)

      ## 3. Improved Prompt
      (Full rewritten prompt, ready to copy-paste)

      ## 4. Before-and-After Example
      (1-2 lines showing a concrete refinement improvement)

      ------------------------------------------------------------
      Here is the original prompt to refine:
      [YOUR_PROMPT]
